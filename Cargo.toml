[workspace]
resolver = "2"

members = [
    "client",
    "daemon",
    "ipc",
    "pipewire",
    "profile",
    "shared",
    "app",
]
default-members = [
    "client",
    "daemon",
    "ipc",
    "pipewire",
    "profile",
    "shared",
]

[workspace.package]
version = "0.1.9"
edition = "2024"

authors = ["Craig McLure <craig@mclure.net>"]
license = "MIT"

homepage = "https://pipeweaver.github.io/"
repository = "https://github.com/pipeweaver/pipeweaver"

[workspace.dependencies]
### Logging ###
log = "0.4"

### Command Line Parsing ###
clap = { version = "4.6", features = ["derive"] }

### Error Handling ###
anyhow = "1.0"

### Project Paths
directories = "6.0"

### Serialisation / Deserialisation ###
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

### Enum Helpers..
strum = { version = "0.28" }
strum_macros = "0.28"
enum-map = { version = "3.1", features = ["serde"] }

### JSON Patching ###
json-patch = "4.2"

### IPC Communication ###
interprocess = { version = "2.4" }

### Device Identification ###
ulid = { version = "3.0", features = ["serde"] }

### TokIO
tokio = { version = "1.51", features = ["rt-multi-thread", "sync", "macros"] }
